<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🌹 Rose Blooming from Code</title>
<meta name="description" content="A single div transforms into a beautiful blooming 3D rose.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@500;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; }
body {
    background: #020002;
    background: radial-gradient(ellipse at 50% 75%, #120105 0%, #050002 55%, #000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}
.vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.9) 100%); z-index:100; pointer-events:none; }
.spotlight { position: fixed; top:35%; left:50%; transform:translate(-50%,-50%); width:85vw; height:85vh; background: radial-gradient(circle, rgba(255,30,80,0.06) 0%, transparent 70%); filter: blur(50px); z-index:5; }
.trigger-overlay { position: fixed; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index:30; transition: opacity 0.5s ease, visibility 0.5s ease; }
.trigger-overlay.fade-out { opacity:0; visibility:hidden; pointer-events:none; }
.glass-card { position:relative; width:min(85vw,340px); background: rgba(22,10,15,0.55); border: 1px solid rgba(255,40,100,0.2); border-radius:24px; padding:35px 24px; display:flex; flex-direction:column; align-items:center; }
.trigger-overlay.fade-out .glass-card { transform: scale(0.85); }
.card-glow { position:absolute; width:150px; height:150px; border-radius:50%; background: radial-gradient(circle, rgba(255,30,80,0.15) 0%, transparent 70%); top:-40px; left:-40px; filter: blur(15px); }
.rose-icon { font-size:54px; margin-bottom:12px; filter: drop-shadow(0 4px 12px rgba(255,30,80,0.4)); animation: pulseIcon 2s ease-in-out infinite; }
@keyframes pulseIcon { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
.glass-card .title { color:#fff; font-family:'Playfair Display',serif; font-size:26px; font-weight:700; letter-spacing:1px; margin-bottom:22px; text-shadow:0 0 10px rgba(255,255,255,0.1); }
.loading-bar-container { width:100%; height:6px; background: rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; margin-bottom:10px; }
.loading-bar { width:0%; height:100%; background: linear-gradient(to right,#ff2e5e,#ff0044); border-radius:3px; transition: width 0.1s linear; }
.status-text { font-size:12px; color:#b5a2b0; font-family:'Fira Code', monospace; margin-bottom:26px; }
.start-button { position:relative; width:100%; padding:16px; background: linear-gradient(135deg,#ff2e5e 0%,#ff0044 100%); border:none; border-radius:12px; color:#fff; font-family:'Inter',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition: transform 0.2s, box-shadow 0.3s; overflow:hidden; box-shadow: 0 4px 15px rgba(255,44,120,0.3); }
.start-button:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); cursor:not-allowed; box-shadow:none; transform:none !important; }
.start-button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,0,68,0.5), 0 0 15px rgba(255,50,90,0.3); }
.start-button:active { transform: translateY(1px); }
.btn-shine { position:absolute; top:0; left:-100%; width:50%; height:100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent); transform: skewX(-25deg); }
.start-button:not(:disabled):hover .btn-shine { animation: shine 1.2s ease-in-out infinite; }
@keyframes shine { 100%{ left:150%; } }
.ambient-light { position: fixed; width:500px; height:500px; border-radius:50%; background: radial-gradient(circle, rgba(255,30,60,0.10) 0%, rgba(255,20,50,0.04) 40%, transparent 65%); top:32%; left:50%; transform: translate(-50%, -50%); opacity:0; transition: opacity 0.4s ease; z-index:15; }
.ambient-light.visible { opacity:1; }
.scene { perspective:1200px; perspective-origin:50% 35%; width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding-bottom:6vh; z-index:20; transform: scale(0.95); }
.rose-wrapper { transform-style: preserve-3d; position: relative; width:300px; height:480px; transform: rotateX(-22deg) rotateY(0deg); will-change: transform; }
.rose-wrapper.rotating { animation: rotateRose 28s linear infinite; }
@keyframes rotateRose { from{ transform: rotateX(-22deg) rotateY(0deg);} to{ transform: rotateX(-22deg) rotateY(360deg);} }
.stem-group { position:absolute; bottom:0; left:50%; transform: translateX(-50%); width:10px; height:250px; transform-style: preserve-3d; }
.stem { position:absolute; bottom:0; left:0; width:100%; height:0%; background: linear-gradient(to top,#092e12 0%,#114c23 30%,#1a6f35 70%,#114c23 100%); border-radius:5px; transition: height 2.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
.stem.grow { height:100%; }
.stem-highlight { position:absolute; top:0; left:1px; width:2.5px; height:100%; background: linear-gradient(to bottom, transparent, rgba(150,255,180,0.15), transparent); }
.thorn { position:absolute; width:11px; height:6px; opacity:0; transition: opacity 0.5s ease 0.4s; z-index:2; }
.thorn::before { content:''; position:absolute; width:100%; height:100%; background: linear-gradient(135deg,#1a6f35,#092e12); clip-path: polygon(0% 85%, 100% 50%, 30% 0%); }
.thorn-1 { right:-9px; bottom:65%; transform: scaleX(-1); }
.thorn-2 { left:-9px; bottom:42%; }
.stem.grow~.thorn { opacity: 0.75; }
.leaf { position:absolute; width:52px; height:25px; opacity:0; transition: opacity 0.6s ease, transform 1.1s cubic-bezier(0.34,1.45,0.64,1); z-index:2; will-change: transform, opacity; }
.leaf::before { content:''; position:absolute; width:100%; height:100%; background: linear-gradient(160deg,#2a944e 0%, #1a6f35 40%, #092e12 100%); border-radius: 2px 65% 2px 65%; }
.leaf-vein { position:absolute; width:60%; height:1px; background: rgba(150,255,180,0.12); top:48%; left:20%; z-index:1; }
.leaf-left { left:-52px; bottom:56%; transform-origin: right center; transform: rotate(35deg) scale(0); }
.leaf-left::before { border-radius: 65% 2px 65% 2px; }
.leaf-right { left:10px; bottom:38%; transform-origin: left center; transform: rotate(-35deg) scale(0); }
.leaf-right::before { border-radius: 2px 65% 2px 65%; }
.leaf.visible { opacity:1; }
.leaf-left.visible { transform: rotate(15deg) scale(1); }
.leaf-right.visible { transform: rotate(-15deg) scale(1); }
.calyx { position:absolute; bottom:242px; left:50%; transform: translateX(-50%); width:0; height:0; transform-style: preserve-3d; z-index:1; }
.sepal { position:absolute; bottom:-4px; left:50%; width:14px; height:32px; transform-origin:50% 100%; background: linear-gradient(to top,#092e12 0%, #15582b 40%, #299c4c 100%); border-radius: 50% 50% 50% 0; opacity:0; transition: opacity 0.4s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
.calyx.visible .sepal { opacity:0.95; transform: translateX(-50%) rotateY(var(--sepal-angle,0deg)) rotateX(var(--sepal-curl,22deg)) scale(1); animation: spawnSepal 0.6s ease backwards; animation-delay: var(--sepal-delay, 0s); }
@keyframes spawnSepal { from { transform: translateX(-50%) scale(0); opacity:0; } to { transform: translateX(-50%) rotateY(var(--sepal-angle,0deg)) rotateX(var(--sepal-curl,22deg)) scale(1); opacity:0.95; } }
.rose-head { position:absolute; bottom:245px; left:50%; transform: translateX(-50%); width:0; height:0; transform-style: preserve-3d; z-index:10; }
.rose-glow { position:absolute; width:400px; height:400px; border-radius:50%; background: radial-gradient(circle, rgba(160,5,30,0.18) 0%, rgba(100,0,20,0.05) 45%, transparent 65%); top:50%; left:50%; transform: translate(-50%, -50%); opacity:0; transition: opacity 0.6s ease; }
.rose-glow-inner { position:absolute; width:200px; height:200px; border-radius:50%; background: radial-gradient(circle, rgba(180,40,60,0.15) 0%, transparent 65%); top:50%; left:50%; transform: translate(-50%, -50%); opacity:0; transition: opacity 0.8s ease; }
.rose-head.blooming .rose-glow { opacity:1; }
.rose-head.blooming .rose-glow-inner { opacity:1; }
.petal { position:absolute; bottom:0; left:50%; transform-origin:50% 100%; opacity:0.002; will-change:transform, opacity; border-radius: 50% 50% 35% 35% / 45% 45% 55% 55%; transform: translateX(-50%) rotateY(var(--angle,0deg)) translateZ(var(--tz,0px)) rotateX(30deg) scale(0); animation: petalBloom var(--bloom-dur,2s) ease-out forwards; animation-delay: var(--delay,0s); }
.rose-head.blooming .petal { opacity:1; transform: translateX(-50%) rotateY(var(--angle,0deg)) translateZ(var(--tz,0px)) rotateX(var(--curl,30deg)) scale(var(--scale,1)); }
@keyframes petalBloom { from { opacity:0.002; transform: translateX(-50%) rotateY(var(--angle,0deg)) translateZ(var(--tz,0px)) rotateX(30deg) scale(0); } to { opacity:1; transform: translateX(-50%) rotateY(var(--angle,0deg)) translateZ(var(--tz,0px)) rotateX(var(--curl,30deg)) scale(var(--scale,1)); } }
.petal-bud { background: linear-gradient(to bottom,#3d0008 0%, #220003 40%, #100001 75%, #040000 100%); }
.petal-core { background: linear-gradient(to bottom,#52000c 0%, #350005 40%, #1a0002 75%, #080000 100%); }
.petal-inner { background: linear-gradient(to bottom,#6d0012 0%, #480008 40%, #250003 75%, #0c0000 100%); }
.petal-mid-inner { background: linear-gradient(to bottom,#850018 0%, #5c000d 40%, #310004 75%, #120000 100%); }
.petal-mid { background: linear-gradient(to bottom,#9a001d 0%, #6e0011 40%, #3b0005 75%, #160000 100%); }
.petal-outer { background: linear-gradient(to bottom,#ad0022 0%, #7e0014 40%, #440007 75%, #1a0001 100%); }
.petal-blush { background: linear-gradient(to bottom,#bf0028 0%, #8e0018 40%, #4e0008 75%, #1e0001 100%); }
.falling-petal { position: fixed; width: var(--fp-w,13px); height: var(--fp-h,17px); background: radial-gradient(ellipse at 40% 30%, var(--fp-c1,#9a001d), var(--fp-c2,#3d0008) 75%); border-radius: 50%; pointer-events:none; animation: fallSway var(--f-dur,5s) ease-in forwards; animation-delay: var(--f-delay,0s); z-index:25; }
@keyframes fallSway {
    0% { opacity:0; transform: translateX(0) translateY(0) rotate(0deg) rotateY(0deg) scale(1); }
    8% { opacity:0.85; }
    25% { transform: translateX(var(--s1,35px)) translateY(20vh) rotate(70deg) rotateY(40deg) scale(0.95); }
    50% { transform: translateX(var(--s2,-25px)) translateY(48vh) rotate(160deg) rotateY(90deg) scale(0.88); }
    75% { transform: translateX(var(--s3,35px)) translateY(75vh) rotate(270deg) rotateY(150deg) scale(0.78); opacity:0.55; }
    100% { opacity:0; transform: translateX(var(--s4,10px)) translateY(108vh) rotate(390deg) rotateY(210deg) scale(0.55); }
}
.end-text { position: fixed; bottom: 8%; left:50%; transform: translateX(-50%); text-align:center; opacity:0; transition: opacity 2s ease; z-index:60; }
.end-text.visible { opacity:1; }
.tagline { font-family:'Playfair Display',serif; font-style: italic; font-size: clamp(18px,5.5vw,30px); color: rgba(255,195,215,0.95); letter-spacing:4px; text-transform:lowercase; text-shadow: 0 0 25px rgba(255,30,80,0.25); }
.rose-emoji { font-size:32px; display:block; animation: floatEmoji 3s ease-in-out infinite; }
@keyframes floatEmoji { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
@media (max-width:480px){ .rose-wrapper { transform: scale(0.82); } .tagline { letter-spacing:2px; } }
@media (max-height:600px){ .rose-wrapper { transform: scale(0.68); } .end-text { bottom:3%; } }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="spotlight"></div>
<div class="ambient-light" id="ambientLight"></div>

<div class="trigger-overlay" id="triggerOverlay">
    <div class="glass-card">
        <div class="card-glow"></div>
        <div class="rose-icon">🌹</div>
        <h2 class="title">Love.css</h2>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
        <p class="status-text" id="statusText">Ready to compile...</p>
        <button class="start-button" id="startButton" disabled>
            <span class="btn-text">Tap to Bloom</span>
            <span class="btn-shine"></span>
        </button>
    </div>
</div>

<div class="scene">
    <div class="rose-wrapper" id="roseWrapper">
        <div class="stem-group">
            <div class="stem" id="stem"><div class="stem-highlight"></div></div>
            <div class="thorn thorn-1" id="thorn1"></div>
            <div class="thorn thorn-2" id="thorn2"></div>
            <div class="leaf leaf-left" id="leafLeft"><div class="leaf-vein"></div></div>
            <div class="leaf leaf-right" id="leafRight"><div class="leaf-vein"></div></div>
        </div>
        <div class="calyx" id="calyx"></div>
        <div class="rose-head" id="roseHead"><div class="rose-glow"></div><div class="rose-glow-inner"></div></div>
    </div>
</div>

<div class="end-text" id="endText">
    <p class="tagline" id="tagline">i coded this for you</p>
    <span class="rose-emoji">🌹</span>
</div>

<div id="fallingPetals"></div>

<script>
(function () {
    const startButton = document.getElementById('startButton');
    const loadingBar = document.getElementById('loadingBar');
    const statusText = document.getElementById('statusText');
    const triggerOverlay = document.getElementById('triggerOverlay');
    const ambientLight = document.getElementById('ambientLight');
    const stem = document.getElementById('stem');
    const thorn1 = document.getElementById('thorn1');
    const thorn2 = document.getElementById('thorn2');
    const leafLeft = document.getElementById('leafLeft');
    const leafRight = document.getElementById('leafRight');
    const calyx = document.getElementById('calyx');
    const roseHead = document.getElementById('roseHead');
    const roseWrapper = document.getElementById('roseWrapper');
    const endText = document.getElementById('endText');
    const fallingPetals = document.getElementById('fallingPetals');

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const petalClasses = ['petal-bud','petal-core','petal-inner','petal-mid-inner','petal-mid','petal-outer','petal-blush'];

    function enableWhenReady() {
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                startButton.disabled = false;
                statusText.textContent = 'Ready to bloom — tap to start';
            }).catch(() => {
                startButton.disabled = false;
                statusText.textContent = 'Ready to bloom — tap to start';
            });
        } else {
            setTimeout(() => {
                startButton.disabled = false;
                statusText.textContent = 'Ready to bloom — tap to start';
            }, 800);
        }
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    async function runLoading() {
        statusText.textContent = 'Compiling style...';
        let progress = 0;
        const start = Date.now();
        const duration = prefersReducedMotion ? 600 : 2200;
        while (progress < 100) {
            const elapsed = Date.now() - start;
            progress = Math.min(100, Math.round((elapsed / duration) * 100));
            loadingBar.style.width = progress + '%';
            await sleep(prefersReducedMotion ? 40 : 30);
        }
        loadingBar.style.width = '100%';
        statusText.textContent = 'Almost there...';
        await sleep(prefersReducedMotion ? 120 : 600);
    }

    function buildCalyx(count = 6) {
        calyx.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const s = document.createElement('div');
            s.className = 'sepal';
            const angle = (i / count) * 360 - 180 + (Math.random() * 18 - 9);
            const delay = (i * 0.06).toFixed(2) + 's';
            const curl = (18 + Math.random() * 12).toFixed(1) + 'deg';
            s.style.setProperty('--sepal-angle', `${angle}deg`);
            s.style.setProperty('--sepal-delay', delay);
            s.style.setProperty('--sepal-curl', curl);
            calyx.appendChild(s);
        }
        calyx.classList.add('visible');
    }

    function buildPetals() {
        const total = 32;
        roseHead.querySelectorAll('.petal').forEach(n => n.remove());
        for (let i = 0; i < total; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            const layerIndex = Math.floor((i / total) * petalClasses.length);
            p.classList.add(petalClasses[layerIndex]);
            const angle = (i / total) * 360;
            const tz = 20 + (layerIndex * 18) + (Math.random() * 8 - 4);
            const curl = 18 + layerIndex * 5 + Math.random() * 12;
            const scale = 0.85 + (layerIndex * 0.12) + (Math.random() * 0.08);
            const delay = (i * 0.04).toFixed(2) + 's';
            const dur = (1.8 + layerIndex * 0.15).toFixed(2) + 's';
            p.style.setProperty('--angle', `${angle}deg`);
            p.style.setProperty('--tz', `${tz}px`);
            p.style.setProperty('--curl', `${curl}deg`);
            p.style.setProperty('--scale', `${scale}`);
            p.style.setProperty('--delay', delay);
            p.style.setProperty('--bloom-dur', dur);
            p.style.transform += ` translateZ(0px)`;
            roseHead.appendChild(p);
        }
    }

    function spawnFallingPetal() {
        if (prefersReducedMotion) return;
        const p = document.createElement('div');
        p.className = 'falling-petal';
        const w = 10 + Math.round(Math.random() * 18);
        const h = Math.round(w * (1.2 + Math.random() * 0.4));
        p.style.setProperty('--fp-w', `${w}px`);
        p.style.setProperty('--fp-h', `${h}px`);
        const colors = [['#ad0022','#3d0008'],['#9a001d','#52000c'],['#bf0028','#6d0012'],['#850018','#350005']];
        const c = colors[Math.floor(Math.random()*colors.length)];
        p.style.setProperty('--fp-c1', c[0]);
        p.style.setProperty('--fp-c2', c[1]);
        const dur = 5 + Math.random() * 6;
        p.style.setProperty('--f-dur', `${dur}s`);
        p.style.setProperty('--f-delay', `0s`);
        p.style.setProperty('--s1', `${Math.round(20 + Math.random() * 60)}px`);
        p.style.setProperty('--s2', `${-Math.round(10 + Math.random() * 60)}px`);
        p.style.setProperty('--s3', `${Math.round(10 + Math.random() * 60)}px`);
        p.style.setProperty('--s4', `${Math.round(-10 + Math.random() * 40)}px`);
        const viewportW = Math.max(document.documentElement.clientWidth||0, window.innerWidth||0);
        const startX = (viewportW / 2) + (Math.random() * 240 - 120);
        p.style.left = `${startX}px`;
        p.style.top = `${-20 + Math.random() * 40}px`;
        fallingPetals.appendChild(p);
        p.addEventListener('animationend', () => { p.remove(); });
        setTimeout(() => p.remove(), (dur + 1) * 1000);
    }

    async function bloomSequence() {
        ambientLight.classList.add('visible');
        triggerOverlay.classList.add('fade-out');
        await sleep(prefersReducedMotion ? 200 : 380);
        stem.classList.add('grow');
        statusText.textContent = 'Growing stem...';
        await sleep(prefersReducedMotion ? 200 : 800);
        thorn1.style.opacity = thorn2.style.opacity = '0.75';
        leafLeft.classList.add('visible');
        leafRight.classList.add('visible');
        statusText.textContent = 'Forming calyx...';
        await sleep(prefersReducedMotion ? 200 : 400);
        buildCalyx(6);
        buildPetals();
        statusText.textContent = 'Blooming...';
        await sleep(prefersReducedMotion ? 120 : 260);
        roseHead.classList.add('blooming');
        if (!prefersReducedMotion) {
            roseWrapper.classList.add('rotating');
        }
        roseWrapper.style.transition = 'transform 1.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        roseWrapper.style.transform = 'rotateX(-22deg) rotateY(0deg)';
        await sleep(prefersReducedMotion ? 400 : 1800);
        endText.classList.add('visible');
        statusText.textContent = 'Done';
        if (!prefersReducedMotion) {
            const spawnInterval = 1100;
            const maxSpawns = 10;
            let spawns = 0;
            const intervalId = setInterval(() => {
                spawnFallingPetal();
                spawns++;
                if (spawns > maxSpawns) {
                    clearInterval(intervalId);
                }
            }, spawnInterval);
        }
    }

    async function startHandler() {
        startButton.disabled = true;
        startButton.classList.add('active');
        await runLoading();
        await bloomSequence();
    }

    function handleKey(e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            if (!startButton.disabled) startHandler();
        }
    }

    function init() {
        enableWhenReady();
        startButton.addEventListener('click', startHandler);
        startButton.addEventListener('keydown', handleKey);
    }

    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
